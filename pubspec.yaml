name: flutter_magento
description: A comprehensive Flutter plugin for Magento e-commerce platform integration
license: NativeMindNONC
version: 2.3.4
homepage: https://github.com/nativemind/flutter_magento

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Platform Interface
  plugin_platform_interface: ^2.1.7
  
  # HTTP Client
  dio: ^5.4.0
  http: ^1.1.0
  
  # State Management
  riverpod: ^2.4.9
  provider: ^6.1.1
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Immutable Models
  freezed_annotation: ^2.4.1
  
  # API Client Generation
  retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network Connectivity
  connectivity_plus: ^5.0.2
  
  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  
  # Logging
  logger: ^2.0.2+1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Offline Support
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.4
  hive_generator: ^2.0.1
  
  # Linting
  flutter_lints: ^3.0.1
  
  # Testing
  mockito: ^5.4.4
  test: ^1.24.9

flutter:
  # This section identifies this package as a Flutter plugin
  plugin:
    platforms:
      android:
        package: ru.nativemind.flutter.magento.flutter_magento
        pluginClass: FlutterMagentoPlugin
      ios:
        pluginClass: FlutterMagentoPlugin
      linux:
        pluginClass: FlutterMagentoPlugin
      macos:
        pluginClass: FlutterMagentoPlugin
      windows:
        pluginClass: FlutterMagentoPlugin
      web:
        pluginClass: FlutterMagentoPlugin
        fileName: flutter_magento_web.dart

  # To add assets to your plugin package, add an "assets" section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a "fonts" section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
