name: flutter_magento
description: A comprehensive Flutter plugin for Magento e-commerce platform integration
version: 2.0.0
homepage: https://github.com/nativemind/flutter_magento

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP Client
  dio: ^6.0.0
  
  # State Management
  riverpod: ^3.0.0
  
  # JSON Serialization
  json_annotation: ^5.0.0
  
  # Immutable Models
  freezed_annotation: ^3.0.0
  
  # API Client Generation
  retrofit: ^5.0.0
  
  # Local Storage
  shared_preferences: ^3.0.0
  
  # Network Connectivity
  connectivity_plus: ^6.0.0
  
  # Security
  crypto: ^4.0.0
  
  # HTTP Interceptors
  dio_interceptors: ^2.0.0
  
  # Logging
  logger: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.4
  
  # Linting
  flutter_lints: ^4.0.0
  
  # Testing
  mockito: ^5.4.4
  test: ^1.24.9

flutter:
  # This section identifies this package as a Flutter plugin
  plugin:
    platforms:
      android:
        package: ru.nativemind.flutter.magento.flutter_magento
        pluginClass: FlutterMagentoPlugin
      ios:
        pluginClass: FlutterMagentoPlugin
      linux:
        pluginClass: FlutterMagentoPlugin
      macos:
        pluginClass: FlutterMagentoPlugin
      windows:
        pluginClass: FlutterMagentoPlugin
      web:
        pluginClass: FlutterMagentoPlugin
        fileName: flutter_magento_web.dart

  # To add assets to your plugin package, add an "assets" section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a "fonts" section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
