name: flutter_magento
description: A comprehensive Flutter plugin for Magento e-commerce platform integration with authentication, cart management, product catalog, orders, and offline support
version: 4.0.1
homepage: https://gitlab.com/libsFlutter/flutter_magento
repository: https://gitlab.com/libsFlutter/flutter_magento
issue_tracker: https://gitlab.com/libsFlutter/flutter_magento/-/issues
documentation: https://gitlab.com/libsFlutter/flutter_magento/-/wikis
topics:
  - magento
  - ecommerce
  - flutter
  - dart
  - api

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # Modern Platform Interface (Dart 3+ base classes)
  plugin_platform_interface: ^2.1.8
  
  # HTTP Client & API Generation
  dio: ^5.8.0
  http: ^1.1.0
  retrofit: ^4.0.1
  
  # State Management
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0
  provider: ^6.1.5
  
  # JSON Serialization & Immutable Models
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  
  # Modern Local Storage
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.15
  shared_preferences: ^2.2.2
  
  # Image Caching & Performance
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.3.1
  visibility_detector: ^0.4.0+2
  
  # Network & Connectivity
  connectivity_plus: ^7.0.0
  
  # Device Information
  device_info_plus: ^12.1.0
  
  # Security & Authentication
  crypto: ^3.0.2
  flutter_secure_storage: ^10.0.0-beta.4
  
  # Logging & Monitoring
  logger: ^2.6.2
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  # Aligned with flutter_localizations
  intl_utils: ^2.8.0  # Version compatible with intl 0.20.2
  
  # Offline Support
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Real-time Communication
  socket_io_client: ^3.1.2
  
  # Archive/ZIP support for RADA format
  archive: ^4.0.7
  
  # Path operations for RADA format
  path: ^1.8.3
  
  # File operations
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.5
  json_serializable: ^6.9.0
  drift_dev: ^2.10.1
  freezed: ^3.2.3
  retrofit_generator: ^10.0.6  # Updated to be compatible with intl 0.20.2
  
  # Pigeon for Type-Safe Code Generation
  pigeon: ^26.0.1
  
  # Testing & Quality
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  mocktail: ^1.0.4
  test: ^1.24.8
  integration_test:
    sdk: flutter
  
  # Test Coverage & Performance
  coverage: ^1.15.0
  alchemist: ^0.12.1
  patrol: ^3.19.0
  flutter_driver:
    sdk: flutter


flutter:
  # This section identifies this package as a Flutter plugin
  plugin:
    platforms:
      android:
        package: ru.nativemind.flutter.magento.flutter_magento
        pluginClass: FlutterMagentoPlugin
      ios:
        pluginClass: FlutterMagentoPlugin
      linux:
        pluginClass: FlutterMagentoPlugin
      macos:
        pluginClass: FlutterMagentoPlugin
      windows:
        pluginClass: FlutterMagentoPlugin
      web:
        pluginClass: FlutterMagentoPlugin
        fileName: flutter_magento_web.dart

  # To add assets to your plugin package, add an "assets" section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a "fonts" section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages


