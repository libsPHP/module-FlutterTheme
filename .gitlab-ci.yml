# GitLab CI/CD для Flutter приложения TaxLien.online
# Версия: 1.0.0

stages:
  - test
  - analyze
  - build
  - deploy

variables:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_CHANNEL: "stable"
  PUB_CACHE_DIR: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_ROOT: "$CI_PROJECT_DIR/flutter"

# Кэширование для ускорения сборки
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - flutter/
    - build/
    - .dart_tool/

# Общие настройки для всех джобов
.default_job:
  before_script:
    - echo "Настройка Flutter окружения..."
    - export PATH="$FLUTTER_ROOT/bin:$PATH"
    - flutter --version
    - flutter doctor
    - flutter pub get

# Тестирование
test:
  stage: test
  extends: .default_job
  script:
    - echo "Запуск unit тестов..."
    - flutter test --coverage
    - echo "Запуск integration тестов..."
    - flutter test integration_test/
  coverage: '/All tests passed!/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/lcov.info
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Анализ кода
analyze:
  stage: analyze
  extends: .default_job
  script:
    - echo "Анализ кода Flutter..."
    - flutter analyze --no-fatal-infos
    - echo "Проверка линтера..."
    - flutter analyze --fatal-infos
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Сборка для Android
build_android:
  stage: build
  extends: .default_job
  image: openjdk:11
  before_script:
    - echo "Настройка Android SDK..."
    - export ANDROID_HOME="$CI_PROJECT_DIR/android-sdk"
    - export PATH="$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$PATH"
    - export PATH="$FLUTTER_ROOT/bin:$PATH"
    - flutter --version
    - flutter doctor
    - flutter pub get
  script:
    - echo "Сборка APK для Android..."
    - flutter build apk --release --target-platform android-arm64
    - echo "Сборка App Bundle для Android..."
    - flutter build appbundle --release --target-platform android-arm64
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Сборка для iOS
build_ios:
  stage: build
  extends: .default_job
  image: apple/swift:5.9
  before_script:
    - echo "Настройка iOS инструментов..."
    - export PATH="$FLUTTER_ROOT/bin:$PATH"
    - flutter --version
    - flutter doctor
    - flutter pub get
  script:
    - echo "Сборка для iOS..."
    - flutter build ios --release --no-codesign
  artifacts:
    paths:
      - build/ios/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Сборка для Web
build_web:
  stage: build
  extends: .default_job
  script:
    - echo "Сборка для Web..."
    - flutter build web --release
    - echo "Оптимизация Web сборки..."
    - cd build/web
    - find . -name "*.js" -exec gzip -9 {} \;
    - find . -name "*.css" -exec gzip -9 {} \;
    - find . -name "*.html" -exec gzip -9 {} \;
  artifacts:
    paths:
      - build/web/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Деплой в staging
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Деплой в staging окружение..."
    - scp -r build/web/* $STAGING_USER@$STAGING_HOST:$STAGING_PATH
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && docker-compose up -d"
  environment:
    name: staging
    url: https://staging.taxlien.online
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Деплой в production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Деплой в production окружение..."
    - scp -r build/web/* $PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_PATH
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && docker-compose up -d"
    - echo "Отправка уведомления в Slack..."
    - curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚀 TaxLien.online успешно развернут в production! Версия: $CI_COMMIT_SHORT_SHA\"}" $SLACK_WEBHOOK_URL
  environment:
    name: production
    url: https://taxlien.online
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  when: manual

# Создание релиза
create_release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Создание GitLab релиза..."
  release:
    name: "TaxLien.online v$CI_COMMIT_TAG"
    description: |
      ## 🚀 TaxLien.online Mobile App Release
      
      ### Что нового:
      - Улучшения производительности
      - Исправления багов
      - Новые функции
      
      ### Скачать:
      - [Android APK](https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build_android&file_type=archive)
      - [Android App Bundle](https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build_android&file_type=archive)
      
      ### Технические детали:
      - Flutter версия: $FLUTTER_VERSION
      - Коммит: $CI_COMMIT_SHORT_SHA
      - Дата сборки: $(date)
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: "Android APK"
          url: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build_android&file_type=archive"
        - name: "Android App Bundle"
          url: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build_android&file_type=archive"
  rules:
    - if: $CI_COMMIT_TAG

# Уведомления
notify_slack:
  stage: .post
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      if [ "$CI_PIPELINE_STATUS" = "success" ]; then
        curl -X POST -H 'Content-type: application/json' --data "{
          \"text\": \"✅ Pipeline успешно завершен для $CI_COMMIT_REF_NAME\",
          \"attachments\": [{
            \"color\": \"good\",
            \"fields\": [{
              \"title\": \"Ветка\",
              \"value\": \"$CI_COMMIT_REF_NAME\",
              \"short\": true
            }, {
              \"title\": \"Коммит\",
              \"value\": \"$CI_COMMIT_SHORT_SHA\",
              \"short\": true
            }, {
              \"title\": \"Автор\",
              \"value\": \"$GITLAB_USER_NAME\",
              \"short\": true
            }]
          }]
        }" $SLACK_WEBHOOK_URL
      else
        curl -X POST -H 'Content-type: application/json' --data "{
          \"text\": \"❌ Pipeline завершился с ошибкой для $CI_COMMIT_REF_NAME\",
          \"attachments\": [{
            \"color\": \"danger\",
            \"fields\": [{
              \"title\": \"Ветка\",
              \"value\": \"$CI_COMMIT_REF_NAME\",
              \"short\": true
            }, {
              \"title\": \"Коммит\",
              \"value\": \"$CI_COMMIT_SHORT_SHA\",
              \"short\": true
            }]
          }]
        }" $SLACK_WEBHOOK_URL
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  when: always
