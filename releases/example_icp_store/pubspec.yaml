name: example_icp_store
description: ICP Store - E-commerce example with ICP cryptocurrency payments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Flutter Magento with blockchain support
  flutter_magento:
    path: ../
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.5
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0
  
  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.1.0
  
  # Navigation
  go_router: ^16.2.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

dependency_overrides:
  flutter_yuku:
    path: ../../flutter_yuku

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

