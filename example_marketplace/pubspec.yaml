name: example_marketplace
description: "Flutter Magento Marketplace Example - Multi-seller marketplace demo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Flutter Magento plugin with Marketplace support
  flutter_magento:
    path: ../
  
  # State management and storage
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0-beta.4
  
  # Environment configuration
  flutter_dotenv: ^5.1.0
  
  # UI enhancements
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
