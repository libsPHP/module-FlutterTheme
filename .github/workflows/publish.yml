name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma-separated, or "all")'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Stage 1: Core package (no dependencies)
  publish-core:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if should publish
        id: check
        run: |
          if [[ "${{ github.event.inputs.packages }}" == "all" ]] || [[ "${{ github.event.inputs.packages }}" == *"core"* ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.should_publish == 'true'

      - name: Setup credentials
        if: steps.check.outputs.should_publish == 'true'
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json

      - name: Publish flutter_magento_core
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/flutter_magento_core
        run: |
          dart pub get
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi
        continue-on-error: true

  # Stage 2: Packages depending only on core
  publish-catalog:
    needs: publish-core
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Check if should publish
        id: check
        run: |
          if [[ "${{ github.event.inputs.packages }}" == "all" ]] || [[ "${{ github.event.inputs.packages }}" == *"catalog"* ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.check.outputs.should_publish == 'true'

      - name: Setup credentials
        if: steps.check.outputs.should_publish == 'true'
        run: |
          mkdir -p $HOME/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > $HOME/.config/dart/pub-credentials.json

      - name: Wait for pub.dev indexing
        if: steps.check.outputs.should_publish == 'true' && needs.publish-core.outputs.published == 'true'
        run: sleep 60

      - name: Publish flutter_magento_catalog
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/flutter_magento_catalog
        run: |
          dart pub get
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            dart pub publish --dry-run
          else
            dart pub publish --force
          fi
        continue-on-error: true

  publish-auth:
