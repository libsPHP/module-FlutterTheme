    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Check if should publish
        id: check
        run: |
          if [[ "${{ github.event.inputs.packages }}" == "all" ]] || [[ "${{ github.event.inputs.packages }}" == *"auth"* ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
