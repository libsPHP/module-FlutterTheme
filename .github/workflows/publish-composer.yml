        run: |
          echo "## Magento Modules Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-core | nativemind/module-bridge-core | ${{ needs.publish-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-routes | nativemind/module-bridge-routes | ${{ needs.publish-routes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-seo | nativemind/module-bridge-seo | ${{ needs.publish-seo.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-app-links | nativemind/module-bridge-applinks | ${{ needs.publish-applinks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-app-banner | nativemind/module-bridge-appbanner | ${{ needs.publish-appbanner.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-debug | nativemind/module-bridge-debug | ${{ needs.publish-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| module-bridge-flutter-web | nativemind/module-bridge-flutterweb | ${{ needs.publish-flutterweb.result }} |" >> $GITHUB_STEP_SUMMARY
