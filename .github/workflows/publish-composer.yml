name: Publish Magento Modules to Packagist

on:
  push:
    tags:
      - 'magento-v*'
    paths:
      - 'magento/**'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to publish (comma-separated, or "all")'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (validate only)'
        type: boolean
        default: false

env:
  PHP_VERSION: '8.2'

jobs:
  # Stage 1: Core module (no NativeMind dependencies)
  publish-core:
    name: Publish module-bridge-core
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if should publish
        id: check
        run: |
          if [[ "${{ github.event.inputs.modules }}" == "all" ]] || \
             [[ "${{ github.event.inputs.modules }}" == *"core"* ]] || \
             [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        if: steps.check.outputs.should_publish == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Validate composer.json
        if: steps.check.outputs.should_publish == 'true'
        working-directory: magento/module-bridge-core
        run: composer validate --strict

      - name: Notify Packagist
        if: steps.check.outputs.should_publish == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          curl -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d'{"repository":{"url":"https://packagist.org/packages/nativemind/module-bridge-core"}}'
        continue-on-error: true

  # Stage 2: Modules depending only on Core
  publish-routes:
    name: Publish module-bridge-routes
    needs: publish-core
    runs-on: ubuntu-latest
    if: always()
    steps:
