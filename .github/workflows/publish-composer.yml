  # Summary
  publish-summary:
    name: Publish Summary
    needs: [publish-core, publish-routes, publish-seo, publish-applinks, publish-appbanner, publish-debug, publish-flutterweb, publish-umbrella, publish-marketplace]
    runs-on: ubuntu-latest
    if: always()
    steps:
