name: flutter_magento_offline
description: Offline support and caching for Flutter Magento SDK
version: 2.0.0
repository: https://github.com/nativemind/flutter_magento
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_magento_core:
    path: ../flutter_magento_core
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
