name: flutter_magento
description: Complete Flutter SDK for Magento e-commerce platform - all modules included.
version: 1.0.0
homepage: https://github.com/libsMagento/flutter_magento
repository: https://github.com/libsMagento/flutter_magento/tree/main/packages/flutter_magento
issue_tracker: https://github.com/libsMagento/flutter_magento/issues

topics:
  - magento
  - ecommerce
  - sdk

environment:
  sdk: ^3.0.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core
  flutter_magento_core: ^1.0.0
  # Feature packages
  flutter_magento_auth: ^1.0.0
  flutter_magento_catalog: ^1.0.0
  flutter_magento_cart: ^1.0.0
  flutter_magento_profile: ^1.0.0
  # Utilities
  flutter_magento_localizations: ^1.0.0
  flutter_magento_ui: ^1.0.0
  # State management
  flutter_magento_riverpod: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
