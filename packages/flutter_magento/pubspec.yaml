name: flutter_magento
description: Complete Flutter SDK for Magento e-commerce platform
version: 2.0.0
repository: https://github.com/nativemind/flutter_magento
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core
  flutter_magento_core:
    path: ../flutter_magento_core
  # Feature packages
  flutter_magento_auth:
    path: ../flutter_magento_auth
  flutter_magento_catalog:
    path: ../flutter_magento_catalog
  flutter_magento_cart:
    path: ../flutter_magento_cart
  flutter_magento_profile:
    path: ../flutter_magento_profile
  # Utilities
  flutter_magento_localizations:
    path: ../flutter_magento_localizations
  flutter_magento_ui:
    path: ../flutter_magento_ui
  # State management
  flutter_magento_riverpod:
    path: ../flutter_magento_riverpod

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
